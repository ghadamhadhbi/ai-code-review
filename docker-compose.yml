  #     timeout: 10s
  #     retries: 3
  #   profiles:
  #     - phase2

  # Git Integration Service (Enable in Phase 2)
  # git-integration:
  #   build:
  #     context: ./services/git-integration
  #     dockerfile: Dockerfile
  #   container_name: git-integration
  #   ports:
  #     - "${GIT_INTEGRATION_SERVICE_PORT:-8000}:8000"
  #   environment:
  #     KAFKA_BOOTSTRAP_SERVERS: kafka:29092
  #     DATABASE_URL: postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-password123}@postgres:5432/${POSTGRES_DB:-code_review}
  #     REDIS_URL: redis://redis:6379
  #     GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET}
