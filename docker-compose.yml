version: '3.8'

services:
  # Kafka Infrastructure
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
    networks:
      - ai-review-network

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "9101:9101"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_METRIC_REPORTERS: io.confluent.metrics.reporter.ConfluentMetricsReporter
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_CONFLUENT_METRICS_REPORTER_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_CONFLUENT_METRICS_REPORTER_TOPIC_REPLICAS: 1
      KAFKA_CONFLUENT_METRICS_ENABLE: "true"
      KAFKA_CONFLUENT_SUPPORT_CUSTOMER_ID: anonymous
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_RETENTION_BYTES: 1073741824
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - ai-review-network
    healthcheck:
      test:
        [
          "CMD",
          "kafka-topics",
          "--bootstrap-server",
          "localhost:9092",
          "--list",
        ]
      interval: 30s
      timeout: 10s
      retries: 3

  # Database
  postgres:
    image: postgres:15-alpine
    container_name: postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-code_review}
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password123}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - ai-review-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-code_review}"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Kafka UI for debugging (Development only)
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    depends_on:
      - kafka
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    networks:
      - ai-review-network
    profiles:
      - debug

  # 🎯 PHASE 1 SERVICES - Core MVP
  
  # AI Review Service (Core brain)
  ai-review:
    build:
      context: ./services/ai-review
      dockerfile: Dockerfile
    container_name: ai-review
    ports:
      - "${AI_REVIEW_SERVICE_PORT:-8001}:8000"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      DATABASE_URL: postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-password123}@postgres:5432/${POSTGRES_DB:-code_review}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OPENAI_MAX_TOKENS: ${OPENAI_MAX_TOKENS:-2000}
      OPENAI_TEMPERATURE: ${OPENAI_TEMPERATURE:-0.1}
      AI_REVIEW_TIMEOUT_SECONDS: ${AI_REVIEW_TIMEOUT_SECONDS:-60}
      KAFKA_TOPIC_CODE_UPLOADS: ${KAFKA_TOPIC_CODE_UPLOADS:-code-uploads}
      KAFKA_TOPIC_REVIEW_RESULTS: ${KAFKA_TOPIC_REVIEW_RESULTS:-review-results}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ENVIRONMENT: ${ENVIRONMENT:-development}
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - ./services/ai-review:/app
      - ./services/shared:/app/shared
    networks:
      - ai-review-network
    restart: unless-stopped

  # API Gateway (File upload + results API)
  api-gateway:
    build:
      context: ./services/api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    ports:
      - "${API_GATEWAY_PORT:-8003}:8000"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      DATABASE_URL: postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-password123}@postgres:5432/${POSTGRES_DB:-code_review}
      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB:-5}
      ALLOWED_FILE_EXTENSIONS: ${ALLOWED_FILE_EXTENSIONS:-.py,.js,.java,.cpp,.c,.h,.jsx,.tsx,.ts,.go,.rs,.php,.rb}
      UPLOAD_TIMEOUT_SECONDS: ${UPLOAD_TIMEOUT_SECONDS:-30}
      MAX_FILES_PER_REVIEW: ${MAX_FILES_PER_REVIEW:-10}
      KAFKA_TOPIC_CODE_UPLOADS: ${KAFKA_TOPIC_CODE_UPLOADS:-code-uploads}
      KAFKA_TOPIC_REVIEW_RESULTS: ${KAFKA_TOPIC_REVIEW_RESULTS:-review-results}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ENVIRONMENT: ${ENVIRONMENT:-development}
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - ./services/api-gateway:/app
      - ./services/shared:/app/shared
      - /tmp/uploads:/tmp/uploads  # Temporary file storage
    networks:
      - ai-review-network
    restart: unless-stopped

  # Metrics Service (Analytics + Dashboard API)
  metrics:
    build:
      context: ./services/metrics
      dockerfile: Dockerfile
    container_name: metrics
    ports:
      - "${METRICS_SERVICE_PORT:-8002}:8000"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      DATABASE_URL: postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-password123}@postgres:5432/${POSTGRES_DB:-code_review}
      KAFKA_TOPIC_CODE_UPLOADS: ${KAFKA_TOPIC_CODE_UPLOADS:-code-uploads}
      KAFKA_TOPIC_REVIEW_RESULTS: ${KAFKA_TOPIC_REVIEW_RESULTS:-review-results}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ENVIRONMENT: ${ENVIRONMENT:-development}
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - ./services/metrics:/app
      - ./services/shared:/app/shared
    networks:
      - ai-review-network
    restart: unless-stopped

  # Notification Service (Email alerts - inline with metrics for simplicity)
  notification:
    build:
      context: ./services/notification
      dockerfile: Dockerfile
    container_name: notification
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SMTP_SERVER: ${SMTP_SERVER:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL}
      SMTP_TO_EMAIL: ${SMTP_TO_EMAIL}
      KAFKA_TOPIC_REVIEW_RESULTS: ${KAFKA_TOPIC_REVIEW_RESULTS:-review-results}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ENVIRONMENT: ${ENVIRONMENT:-development}
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./services/notification:/app
      - ./services/shared:/app/shared
    networks:
      - ai-review-network
    restart: unless-stopped

  # Frontend Dashboard (React app)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    ports:
      - "3000:3000"
    environment:
      REACT_APP_API_URL: ${REACT_APP_API_URL:-http://localhost:8003}
      NODE_ENV: development
    depends_on:
      - api-gateway
      - metrics
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - ai-review-network
    restart: unless-stopped

  # 🔮 PHASE 2 SERVICES - Future Features (Disabled)
  
  # Redis Cache (Enable in Phase 2)
